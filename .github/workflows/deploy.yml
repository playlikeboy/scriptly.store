name: Deploy to Cloudflare
# Production deploy keeps Cloudflare runtime secrets synchronized with GitHub Actions.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Validate deploy and runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID }}
          NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY }}
          HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_HEXCLAVE_PROJECT_ID"
          test -n "$NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY"
          test -n "$HEXCLAVE_SECRET_SERVER_KEY"
          test -n "$DATABASE_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Sync runtime secrets to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID }}
          NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY }}
          HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          bun -e 'process.stdout.write(JSON.stringify({
            NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: process.env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID,
            NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY: process.env.NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY,
            HEXCLAVE_SECRET_SERVER_KEY: process.env.HEXCLAVE_SECRET_SERVER_KEY,
            DATABASE_URL: process.env.DATABASE_URL
          }))' | bunx wrangler secret bulk

      - name: Build and Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID }}
          NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY }}
          HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run deploy
